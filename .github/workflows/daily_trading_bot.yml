name: Daily Trading Bot Ensemble

on:
  #schedule:
    # Runs at 11:00 PM UTC Monday-Friday 
    # Adjust the cron schedule to match when your market data is ready
    # changing the schedule to run at 9:05 am IST every weekday
    #- cron: '05 9 * * 1-5'
    #  timezone: 'Asia/Kolkata'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13' # Adjust to your needed version

      - name: Install Dependencies
        # Make sure your requirements.txt includes stable-baselines3, google-api-python-client, etc.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trading Bot Script
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          # This pulls your Secret and injects it as an environment variable for Python to read
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          python final_script_n.py

      # Turn off comments once the script is available
      - name: Run Captial Allocation Engine Script
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: python cap_alloc_engine.py --live_trade 1 --target_tickers VEDL JAMNAAUTO MOTHERSON LTF POWERGRID 
       
